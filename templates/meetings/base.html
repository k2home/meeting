<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Manager</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202735;background:#f3f5f8}body{margin:0}header{background:#182536;color:white;padding:1rem 5vw;display:flex;gap:1.5rem;align-items:center}header a{color:white;text-decoration:none}main{max-width:1100px;margin:2rem auto;padding:0 1rem}.card{background:white;border:1px solid #dfe4eb;border-radius:12px;padding:1.2rem;margin:1rem 0}a{color:#1759a6}input,textarea,select{box-sizing:border-box;width:100%;padding:.7rem;border:1px solid #bac4d1;border-radius:7px;margin:.25rem 0 1rem}button,.btn{background:#185da8;color:white;border:0;border-radius:7px;padding:.7rem 1rem;cursor:pointer;text-decoration:none;display:inline-block}small,.muted{color:#667085}.messages{background:#e9f5ed;padding:.8rem;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.6rem;border-bottom:1px solid #e5e7eb}
@media print{header,.no-print{display:none}body{background:white}.card{border:0}}
</style></head><body><header><strong>Meeting Manager</strong><a href="/">Übersicht</a><a href="/topics/new/">Neues Thema</a>{% if user.is_staff %}<a href="/admin/series/">Besprechungsreihen</a><a href="/django-admin/">Verwaltung</a>{% endif %}<span style="margin-left:auto">{{ user.username }}</span><a href="/logout/">Abmelden</a></header><main>{% for message in messages %}<p class="messages">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
