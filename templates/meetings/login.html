{% extends "meetings/base.html" %}
{% block title %}Anmelden · Meeting Manager{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:4rem auto">
<h1>Anmelden</h1>
<p class="muted">Bitte mit deinem persönlichen Benutzerkonto anmelden.</p>
<form method="post">
{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
{{ form.as_p }}
<button type="submit" style="width:100%">Anmelden</button>
</form>
</div>
{% endblock %}
