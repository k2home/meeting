{% extends "meetings/base.html" %}
{% block title %}Passwort ändern – Meeting Manager{% endblock %}
{% block content %}
<div class="topline"><h1>Passwort setzen</h1><a class="btn secondary" href="{% url 'user_list' %}">Zurück zur Benutzerliste</a></div>
<section class="card">
<p>Neues Passwort für <strong>{{ target.username }}</strong> festlegen.</p>
<form method="post">{% csrf_token %}
{{ form.as_p }}
<div class="actions"><button type="submit">Passwort speichern</button><a class="btn secondary" href="{% url 'user_list' %}">Abbrechen</a></div>
</form>
</section>
{% endblock %}
