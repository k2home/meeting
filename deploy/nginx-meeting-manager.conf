server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Ordinary requests and topic attachments are deliberately bounded.
    client_max_body_size 32m;

    location /static/ {
        alias /opt/meeting-manager/staticfiles/;
        # Clients must revalidate every asset after a server update.
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # PostgreSQL full-backup imports may legitimately exceed the normal upload limit.
    location = /verwaltung/daten/vollbackup/import/ {
        client_max_body_size 1g;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        # Do not let browsers or iOS home-screen web apps reuse stale HTML.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The installer restricts this listener to TRUSTED_PROXY; the upstream proxy
        # must overwrite client-supplied forwarding headers and send https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
