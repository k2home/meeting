server {
    listen 80;
    server_name _;

    # Ordinary requests and topic attachments are deliberately bounded.
    client_max_body_size 32m;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # PostgreSQL full-backup imports may legitimately exceed the normal upload limit.
    location = /verwaltung/daten/vollbackup/import/ {
        client_max_body_size 1g;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme provided by an upstream HTTPS reverse proxy.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
