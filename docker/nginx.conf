# The upstream HTTPS proxy must overwrite X-Forwarded-For with the actual client IP.
map $http_x_forwarded_for $meeting_login_client {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $meeting_login_client zone=meeting_login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1g;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Throttle repeated login requests per source IP to reduce password guessing.
    location = /login/ {
        limit_req zone=meeting_login_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme provided by an upstream HTTPS reverse proxy.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
