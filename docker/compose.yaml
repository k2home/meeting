services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_manager}
      POSTGRES_USER: ${POSTGRES_USER:-meetingapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetingapp} -d ${POSTGRES_DB:-meeting_manager}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${MEETING_IMAGE:-docker.io/k2hadocker/meeting-manager:latest}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "0"
      TEST_DOCUMENTATION_SOURCE_PATH: /app/local-test-docs/Pruefung-des-Verfahrens-Testdokumentation.md
    group_add:
      - "10002"
    volumes:
      - media_data:/app/media
      - docs_data:/app/local-test-docs
      - static_data:/app/staticfiles
      - /run/meeting-manager-updater:/run/meeting-manager-updater
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    expose:
      - "8000"

  retention:
    image: ${MEETING_IMAGE:-docker.io/k2hadocker/meeting-manager:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: "while true; do python manage.py purge_expired_data || echo 'Aufbewahrungsprüfung fehlgeschlagen'; sleep 86400; done"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "0"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    depends_on:
      - app

volumes:
  postgres_data:
  media_data:
  docs_data:
  static_data:
