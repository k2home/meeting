name: Container image vulnerability scan

on:
  pull_request:
  push:
    branches:
      - main
      - beta
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Build and scan application image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --file docker/Dockerfile --tag meeting-manager:security-scan .

      - name: Scan image for OS and Python library vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: meeting-manager:security-scan
          version: v0.76.2
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan ClamAV sidecar image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clamav/clamav:stable
          version: v0.76.2
          format: sarif
          output: clamav-trivy-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload application image scan to GitHub code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-application

      - name: Upload ClamAV image scan to GitHub code scanning
        if: always() && hashFiles('clamav-trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clamav-trivy-results.sarif
          category: container-clamav
