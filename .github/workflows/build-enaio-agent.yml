name: Build enaio Windows agent

on:
  pull_request:
    paths:
      - "desktop/enaio-agent/**"
      - ".github/workflows/build-enaio-agent.yml"
  push:
    branches: [beta, main]
    paths:
      - "desktop/enaio-agent/**"
      - ".github/workflows/build-enaio-agent.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows agent
        run: dotnet publish desktop/enaio-agent/MeetingManager.EnaioAgent.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-manager-enaio-agent-win-x64
          path: publish/**
          if-no-files-found: error
