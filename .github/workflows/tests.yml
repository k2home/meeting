name: Django tests

on:
  push:
    branches:
      - main
      - beta
      - feature/native-linux-deployment
      - feature/usability-and-core-workflows
      - chat
      - fix/agenda-followup-linkage
      - ui-sidebar-horizontal-brand-mobile-short-name
      - fix-safari-icons-all-references
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debian 12 uses the updater-managed CPython 3.12 runtime; Debian 13 provides Python 3.13.
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meeting_manager
          POSTGRES_USER: meetingapp
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetingapp -d meeting_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify Debian/Ubuntu one-click installer in README
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          marker = "### Debian / Ubuntu mit systemd und Nginx"
          if marker not in readme:
              raise SystemExit("Debian/Ubuntu installation section is missing from README")
          section = readme.split(marker, 1)[1].split("\n### ", 1)[0]
          required = [
              "sudo apt update",
              "sudo apt install git -y",
              "git clone https://github.com/k2home/meeting.git",
              "cd meeting",
              "sudo bash deploy/install-debian.sh",
          ]
          missing = [line for line in required if line not in section]
          if missing:
              raise SystemExit("README one-click installer is incomplete: " + ", ".join(missing))
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
      - name: Install native SVG runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-constraints.txt
          python -c 'import cairosvg; png = cairosvg.svg2png(bytestring=b"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"2\" height=\"2\"><rect width=\"2\" height=\"2\" fill=\"#00549f\"/></svg>"); assert png.startswith(b"\x89PNG\r\n\x1a\n")'
      - name: Run Django checks
        env:
          SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
          DEBUG: "0"
          ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: meeting_manager
          POSTGRES_USER: meetingapp
          POSTGRES_PASSWORD: test-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
        run: |
          bash -n deploy/*.sh
          bash -n deploy/meeting-manager-update
          bash -n deploy/meeting-manager-update-runner
          python -m compileall -q config meetings
          python -m py_compile deploy/docker-update-agent.py
          python manage.py check
          SECRET_KEY="ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ" SECURE_SSL_REDIRECT=1 SECURE_HSTS_SECONDS=31536000 SESSION_COOKIE_SECURE=1 CSRF_COOKIE_SECURE=1 python manage.py check --deploy
          # Every model change in every PR must ship its Django migration files.
          python manage.py makemigrations --check --dry-run
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db.migrations.loader import MigrationLoader
          conflicts = MigrationLoader(None).detect_conflicts()
          if conflicts:
              details = "; ".join(f"{app}: {', '.join(names)}" for app, names in conflicts.items())
              raise SystemExit("Conflicting Django migrations: " + details)
          PY
          python manage.py migrate --noinput
          # Simulate the updater-managed testing installation: config.urls exposes
          # Django admin routes only while this marker is present.
          sudo mkdir -p /var/lib/meeting-manager-updater
          sudo touch /var/lib/meeting-manager-updater/testing-mode
          python manage.py test meetings
